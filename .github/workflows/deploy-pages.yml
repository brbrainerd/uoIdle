name: Deploy UO Idle Review Portal & Mockups to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Create .nojekyll
        run: touch .nojekyll
      - name: Stage static portal assets
        run: |
          mkdir -p _site
          cp index.html .nojekyll README.md _site/
          cp -R mockups design data schemas mechanics _site/
          rm -rf _site/mechanics/_raw _site/mechanics/_crawl
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
